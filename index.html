<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a la Sala</title>
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            display: flex;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .card-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.825rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <main class="app-container">
        <section id="login-screen" class="card glass">
            <div class="card-header">
                <i data-lucide="messages-square" class="brand-icon"></i>
                <h2>Acceso a la Sala</h2>
                <p>Ingresa tus datos para unirte a la conversación</p>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" placeholder="ejemplo@correo.com" required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <i data-lucide="shield-check"></i>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                    </div>
                    <span id="password-error" class="error-message">Las contraseñas no coinciden</span>
                </div>

                <button type="submit" class="btn">
                    <span>Entrar al Chat</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </form>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const loginForm = document.getElementById('login-form');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const passwordError = document.getElementById('password-error');

            // Nuevo enlace del grupo de WhatsApp
            const targetGroupUrl = "https://chat.whatsapp.com/FxMmENIm3duAFC7gZcZkir";

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const pass = passwordInput.value;
                const confirmPass = confirmPasswordInput.value;

                if (pass !== confirmPass) {
                    passwordError.style.display = 'block';
                    return;
                }

                passwordError.style.display = 'none';

                // Forzar la apertura del enlace de WhatsApp rompiendo marcos de GoDaddy/iFrames
                if (window.top !== window.self) {
                    window.top.location.href = targetGroupUrl;
                } else {
                    window.location.href = targetGroupUrl;
                }
            });
        });
    </script>
</body>
</html>
